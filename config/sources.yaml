# AI Intelligence Pipeline — Data Source Registry
# Configurable source definitions for all ingestion targets.
# Categories: startup, product, research, news, job
# Crawl methods: http, browser

sources:
  # ============================================================================
  # 1. Startup Sources
  # ============================================================================
  - name: "Y Combinator AI Startups"
    base_url: "https://www.ycombinator.com/companies?industry=AI"
    category: "startup"
    crawl_method: "browser"
    enabled: true
    rate_limit_per_second: 1.0
    max_concurrency: 2
    timeout_seconds: 45.0

  - name: "Techstars AI Portfolio"
    base_url: "https://www.techstars.com/portfolio"
    category: "startup"
    crawl_method: "http"
    enabled: true
    rate_limit_per_second: 2.0
    max_concurrency: 3
    timeout_seconds: 30.0

  # ============================================================================
  # 2. Product Sources
  # ============================================================================
  - name: "Product Hunt AI"
    base_url: "https://www.producthunt.com/topics/artificial-intelligence"
    category: "product"
    crawl_method: "browser"
    enabled: true
    rate_limit_per_second: 1.0
    max_concurrency: 2
    timeout_seconds: 45.0

  - name: "Futurepedia"
    base_url: "https://www.futurepedia.io/"
    category: "product"
    crawl_method: "http"
    enabled: true
    rate_limit_per_second: 2.0
    max_concurrency: 4
    timeout_seconds: 30.0

  - name: "Theres An AI For That"
    base_url: "https://theresanaiforthat.com/"
    category: "product"
